[workspace]
resolver = "2"
members = [
    "crates/braniac-types",
    "crates/braniac-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Ognjen Jovanovic"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
braniac-types = { path = "crates/braniac-types" }
braniac-core = { path = "crates/braniac-core" }
